<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    [hidden] { display: none !important; }
    .auth-panel { padding: 20px; border: 1px solid #51667c; border-radius: 14px; }
    label { display: block; margin: 12px 0; }
    input, button, textarea { font: inherit; padding: 10px 12px; border-radius: 8px; }
    textarea { display: block; margin-top: 6px; width: 100%; min-height: 100px; box-sizing: border-box; }
    input { display: block; margin-top: 6px; width: min(100%, 320px); box-sizing: border-box; }
    button { cursor: pointer; border: 1px solid #8ad8df; background: #23465b; color: #ecf4ff; }
    #auth-error { color: #ffb8c4; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 자료실</div>
    <h1>내 자료실</h1>
    <section class="auth-panel" aria-label="자료실 로그인">
      <p id="auth-status" role="status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label>이메일<input id="login-email" type="email" autocomplete="username" required></label>
        <label>비밀번호<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-error" role="alert" hidden></p>
    </section>
    <p>아래 기록은 모두 실습용 가상 자료입니다. 서버가 학습용 DB에서 읽어 보여 줍니다.</p>
    <div class="notice">로그인한 계정의 메모만 읽고 추가·수정·삭제할 수 있습니다. 실제 학생 자료를 넣지 마세요. 이전 공개 커밋과 배포에 남은 자료도 사라진 것이 아닙니다.</div>
    <section id="note-editor" class="auth-panel" aria-label="가상 메모 작성" hidden>
      <form id="note-form">
        <label>메모 제목<input id="note-title" maxlength="100" required></label>
        <label>가상 메모 내용<textarea id="note-body" maxlength="2000" required></textarea></label>
        <button id="note-save" type="submit">메모 추가</button>
        <button id="note-cancel" type="button" hidden>수정 취소</button>
      </form>
      <p id="operation-status" role="status"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인하면 가상 자료를 볼 수 있습니다.</li></ul>
  </main>
  <script type="module" src="/auth.js"></script>
  <script type="module" src="/notes.js"></script>
</body>
</html>
